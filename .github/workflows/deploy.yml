name: Continuous Deployment to OCI

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Log di inizio build
        run: echo "[LOG] Avvio della compilazione dell'immagine Docker per OCI Container Instances..."

      - name: Login a OCI Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.OCI_REGISTRY_URL }}
          username: ${{ secrets.OCI_REGISTRY_USER }}
          password: ${{ secrets.OCI_REGISTRY_PASSWORD }}

      - name: Build e Push dell'immagine
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ secrets.OCI_REGISTRY_URL }}/opendeep-ai:latest

      - name: Log di completamento
        run: echo "[LOG] Immagine caricata con successo su OCI Registry. Pronta per il pull su OCI Container Instances."
