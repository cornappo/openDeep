<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cervelletto pro</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 90vh; box-sizing: border-box; }
    h2 { font-size: 1.2rem; margin-top: 0; color: #fff; border-bottom: 1px solid #333; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .status-badge { font-size: 0.75rem; background: #1b4332; color: #52b788; padding: 3px 8px; border-radius: 10px; font-weight: normal; }
    #chat-box { flex: 1; overflow-y: auto; border: 1px solid #333; padding: 15px; margin-bottom: 15px; border-radius: 8px; background: #1e1e1e; display: flex; flex-direction: column; gap: 12px; }
    .message-container { display: flex; flex-direction: column; max-width: 85%; }
    .message-container.user { align-self: flex-end; }
    .message-container.ai { align-self: flex-start; }
    .message { padding: 10px 14px; border-radius: 8px; line-height: 1.4; word-break: break-word; }
    .user { background: #005f73; color: #fff; border-top-right-radius: 2px; }
    .ai { background: #2b2b2b; color: #f0f0f0; border: 1px solid #444; border-top-left-radius: 2px; display: flex; flex-direction: column; gap: 8px; }
    .msg-timestamp { font-size: 0.65rem; color: #888; margin-top: 3px; padding: 0 4px; }
    .user-time { text-align: right; }
    .ai-time { text-align: left; }
    .input-area { display: flex; flex-direction: column; gap: 8px; background: #1e1e1e; padding: 12px; border-radius: 8px; border: 1px solid #333; }
    .input-row { display: flex; gap: 10px; align-items: center; }
    textarea { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #121212; color: #fff; resize: none; height: 45px; font-family: inherit; }
    button { padding: 0 20px; border: none; background: #0a9396; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; height: 45px; }
    button:active { background: #005f73; }
    button.tool-btn { background: #333; color: #ccc; width: 45px; padding: 0; display: flex; align-items: center; justify-content: center; border: 1px solid #444; }
    button.tool-btn.recording { background: #d90429; color: white; animation: pulse 1.5s infinite; }
    .loading { font-style: italic; color: #888; }
    .action-chip { background: #1d3557; color: #a8dadc; border: 1px solid #457b9d; padding: 6px 12px; border-radius: 16px; font-size: 0.85rem; cursor: pointer; font-weight: bold; transition: background 0.2s; display: inline-block; margin: 2px 4px; text-decoration: none; }
    .action-chip:hover { background: #457b9d; color: #fff; }
    .action-chip.depth-plus { border-color: #2a9d8f; color: #52b788; }
    .action-chip.depth-minus { border-color: #e76f51; color: #f4a261; }
    
    .launcher-chips-bar { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; background: #181818; padding: 8px; border: 1px solid #333; border-radius: 8px; }
    .launcher-chip { background: #22223b; color: #c9ada7; border: 1px solid #4a4e69; padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; text-align: left; display: flex; align-items: center; gap: 6px; }
    .launcher-chip:hover { background: #4a4e69; color: #fff; border-color: #9a8c98; }
    .launcher-chip.depth-plus { border-color: #2a9d8f; color: #52b788; }
    .launcher-chip.depth-minus { border-color: #e76f51; color: #f4a261; }

    .file-badge { font-size: 0.8rem; background: #0369a1; color: white; padding: 4px 8px; border-radius: 4px; display: inline-flex; align-items: center; gap: 6px; }
    table { width: 100%; border-collapse: collapse; margin: 8px 0; }
    th, td { border: 1px solid #444; padding: 6px 8px; font-size: 0.85rem; text-align: left; }
    th { background: #333; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  </style>
</head>
<body>
  <h2>🧠 Cervelletto pro <span class="status-badge" id="systemStatus">Pronto</span></h2>
  
  <div id="launcherChipsContainer" class="launcher-chips-bar"></div>

  <div id="chat-box">
    <div class="message-container ai">
      <div class="message ai">Sistema pronto. Inserisci un episodio, detta un messaggio o allega un file.</div>
      <div class="msg-timestamp ai-time" id="initTime"></div>
    </div>
  </div>

  <div class="input-area">
    <div id="file-preview" style="display:none;"></div>
    <div class="input-row">
      <input type="file" id="fileInput" style="display:none" onchange="gestisciFileSelezionato(this)">
      <button type="button" class="tool-btn" onclick="document.getElementById('fileInput').click()" title="Allega File">📎</button>
      <button type="button" id="micBtn" class="tool-btn" onclick="attivaDettaturaVocale()" title="Dettatura Vocale">🎙️</button>
      <textarea id="userInput" placeholder="Scrivi cosa è successo..." onkeydown="checkEnter(event)"></textarea>
      <button onclick="inviaMessaggio()">Invia</button>
    </div>
  </div>

  <script>
    document.getElementById('initTime').innerText = formattaDataOra(new Date());
    let fileAllegatoCorrente = null;
    let riconoscimentoVocale = null;

    document.addEventListener("DOMContentLoaded", function() {
      aggiornaSuggerimentiIniziali();
    });

    async function aggiornaSuggerimentiIniziali() {
      console.log("[LOG FRONTEND] Richiesta suggerimenti iniziali...");
      try {
        const response = await fetch('/api/suggerimenti');
        const listaSuggerimenti = await response.json();
        console.log("[LOG FRONTEND] Suggerimenti ricevuti:", listaSuggerimenti);
        mostraLauncherChips(listaSuggerimenti);
      } catch (err) {
        console.warn("[LOG FRONTEND] Errore caricamento suggerimenti:", err);
      }
    }

    function mostraLauncherChips(lista) {
      const container = document.getElementById('launcherChipsContainer');
      if (!container || !Array.isArray(lista)) return;
      container.innerHTML = "";
      
      lista.forEach((chip, index) => {
        const btn = document.createElement('button');
        btn.className = 'launcher-chip';
        
        if (chip.etichetta.includes("+") || index === 0) {
          btn.classList.add('depth-plus');
        } else if (chip.etichetta.includes("-") || index === 1) {
          btn.classList.add('depth-minus');
        }

        btn.innerText = chip.etichetta;
        btn.onclick = function() {
          const tuttiIbottoni = container.querySelectorAll('button');
          tuttiIbottoni.forEach(b => {
            b.disabled = true;
            b.style.opacity = '0.5';
            b.style.cursor = 'not-allowed';
          });

          document.getElementById('userInput').value = chip.testoPrompt;
          inviaMessaggio();
        };
        container.appendChild(btn);
      });
    }

    function checkEnter(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        inviaMessaggio();
      }
    }

    function formattaDataOra(date) {
      var d = new Date(date);
      var giorno = String(d.getDate()).padStart(2, '0');
      var mese = String(d.getMonth() + 1).padStart(2, '0');
      var anno = d.getFullYear();
      var ore = String(d.getHours()).padStart(2, '0');
      var minuti = String(d.getMinutes()).padStart(2, '0');
      var secondi = String(d.getSeconds()).padStart(2, '0');
      return giorno + '/' + mese + '/' + anno + ' ' + ore + ':' + minuti + ':' + secondi;
    }

    function attivaDettaturaVocale() {
      const micBtn = document.getElementById('micBtn');
      const userInput = document.getElementById('userInput');

      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert("Il tuo browser non supporta la dettatura vocale.");
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      riconoscimentoVocale = new SpeechRecognition();
      riconoscimentoVocale.lang = 'it-IT';
      riconoscimentoVocale.interimResults = false;

      riconoscimentoVocale.onstart = () => { micBtn.classList.add('recording'); };
      riconoscimentoVocale.onresult = (event) => {
        userInput.value += (userInput.value ? " " : "") + event.results[0][0].transcript;
      };
      riconoscimentoVocale.onerror = () => { micBtn.classList.remove('recording'); };
      riconoscimentoVocale.onend = () => { micBtn.classList.remove('recording'); };

      riconoscimentoVocale.start();
    }

    function gestisciFileSelezionato(input) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
          fileAllegatoCorrente = {
            name: file.name,
            mimeType: file.type || 'application/octet-stream',
            base64Data: e.target.result
          };
          document.getElementById('file-preview').style.display = 'block';
          document.getElementById('file-preview').innerHTML = `<span class="file-badge">📎 ${file.name} <span onclick="rimuoviFile()" style="cursor:pointer; font-weight:bold;">×</span></span>`;
        };
        reader.readAsDataURL(file);
      }
    }

    function rimuoviFile() {
      fileAllegatoCorrente = null;
      document.getElementById('fileInput').value = '';
      document.getElementById('file-preview').style.display = 'none';
      document.getElementById('file-preview').innerHTML = '';
    }

    async function inviaMessaggio() {
      var input = document.getElementById('userInput');
      var text = input.value.trim();
      if (!text && !fileAllegatoCorrente) return;

      console.log("[LOG FRONTEND] Invio messaggio al server:", text);

      var chatBox = document.getElementById('chat-box');
      var oraInvio = new Date();
      
      let htmlUtente = escapeHtml(text);
      if (fileAllegatoCorrente) {
        htmlUtente += `<br><small style="color:#38bdf8;">📎 [Allegato: ${fileAllegatoCorrente.name}]</small>`;
      }

      var userContainer = document.createElement('div');
      userContainer.className = 'message-container user';
      userContainer.innerHTML = '<div class="message user">' + htmlUtente + '</div>' +
                                '<div class="msg-timestamp user-time">' + formattaDataOra(oraInvio) + '</div>';
      chatBox.appendChild(userContainer);
      
      input.value = '';
      var fileDaInviare = fileAllegatoCorrente;
      rimuoviFile();
      
      var loadingId = 'load_' + Date.now();
      var loadContainer = document.createElement('div');
      loadContainer.className = 'message-container ai';
      loadContainer.id = loadingId;
      loadContainer.innerHTML = '<div class="message ai loading" id="loadingText_' + loadingId + '">🔄 Avvio operazione asincrona...</div>' +
                                '<div class="msg-timestamp ai-time">' + formattaDataOra(new Date()) + '</div>';
      chatBox.appendChild(loadContainer);
      chatBox.scrollTop = chatBox.scrollHeight;

      document.getElementById('systemStatus').innerText = "Elaborazione...";
      document.getElementById('systemStatus').style.background = "#9d0208";
      document.getElementById('systemStatus').style.color = "#ffba08";

      try {
        const resTask = await fetch('/api/avvia-task', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ payloadUtente: text, fileAllegato: fileDaInviare })
        });
        const taskData = await resTask.json();
        const tokenTask = taskData.tokenTask;

        if (!tokenTask) {
          if (document.getElementById(loadingId)) document.getElementById(loadingId).remove();
          mostraErroreChat(chatBox, "⚠️ Errore: Token del task non valido.");
          ripristinaStatoPronto();
          return;
        }

        var pollingInterval = setInterval(async () => {
          try {
            const resPoll = await fetch('/api/controlla-stato', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ tokenTask, payloadUtente: text, fileAllegato: fileDaInviare })
            });
            const statoTask = await resPoll.json();
            if (!statoTask) return;

            var el = document.getElementById('loadingText_' + loadingId);
            if (el && statoTask.log && statoTask.log.length > 0) {
              el.innerText = "🔄 " + statoTask.log[statoTask.log.length - 1];
            }

            if (statoTask.stato === "COMPLETATO" || statoTask.stato === "ERRORE") {
              clearInterval(pollingInterval);
              
              if (document.getElementById(loadingId)) {
                document.getElementById(loadingId).remove();
              }

              if (statoTask.stato === "COMPLETATO") {
                renderResponseHypertext(chatBox, statoTask.risultato);
              } else {
                mostraErroreChat(chatBox, statoTask.risultato || "Errore sconosciuto dal server.");
              }

              chatBox.scrollTop = chatBox.scrollHeight;
              ripristinaStatoPronto();
              aggiornaSuggerimentiIniziali();
            }
          } catch (pollErr) {
            console.warn("Errore di polling:", pollErr);
          }
        }, 1500);

      } catch (err) {
        if (document.getElementById(loadingId)) {
          document.getElementById(loadingId).remove();
        }
        console.error("[LOG FRONTEND] Errore avvio task:", err);
        mostraErroreChat(chatBox, "⚠️ Errore di comunicazione con il server Node.js.");
        ripristinaStatoPronto();
      }
    }

    function renderResponseHypertext(chatBox, rawResponse) {
      var messageContainer = document.createElement('div');
      messageContainer.className = 'message-container ai';

      var messageDiv = document.createElement('div');
      messageDiv.className = 'message ai';

      var textSpan = document.createElement('div');
      
      let htmlTradotto = escapeHtml(rawResponse ? rawResponse.trim() : "Risposta vuota dal server.");
      
      htmlTradotto = htmlTradotto.replace(/\[\[([\s\S]*?)\|([\s\S]*?)\]\]/g, function(match, testoVisibile, promptInviato) {
        let promptPulito = promptInviato.replace(/"/g, '&quot;');
        let classeStile = testoVisibile.trim().startsWith('+') ? 'action-chip depth-plus' : (testoVisibile.trim().startsWith('-') ? 'action-chip depth-minus' : 'action-chip');
        return `<span class="${classeStile}" onclick="eseguiPromptInline('${promptPulito}')">${testoVisibile} ↗</span>`;
      });

      htmlTradotto = htmlTradotto.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      htmlTradotto = htmlTradotto.replace(/\*(.*?)\*/g, '<em>$1</em>');
      htmlTradotto = htmlTradotto.replace(/---/g, '<hr style="border:0; border-top:1px solid #444; margin:8px 0;">');
      htmlTradotto = htmlTradotto.replace(/\n/g, '<br>');

      textSpan.innerHTML = htmlTradotto;
      messageDiv.appendChild(textSpan);
      messageContainer.appendChild(messageDiv);

      var timeDiv = document.createElement('div');
      timeDiv.className = 'msg-timestamp ai-time';
      timeDiv.innerText = formattaDataOra(new Date());
      messageContainer.appendChild(timeDiv);

      chatBox.appendChild(messageContainer);
    }

    function eseguiPromptInline(promptTesto) {
      document.getElementById('userInput').value = promptTesto;
      inviaMessaggio();
    }

    function mostraErroreChat(chatBox, messaggioErrore) {
      var errContainer = document.createElement('div');
      errContainer.className = 'message-container ai';
      errContainer.innerHTML = '<div class="message ai" style="color:#ff6b6b; border-color:#d90429;">' + escapeHtml(messaggioErrore) + '</div>' +
                               '<div class="msg-timestamp ai-time">' + formattaDataOra(new Date()) + '</div>';
      chatBox.appendChild(errContainer);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function ripristinaStatoPronto() {
      document.getElementById('systemStatus').innerText = "Pronto";
      document.getElementById('systemStatus').style.background = "#1b4332";
      document.getElementById('systemStatus').style.color = "#52b788";
    }

    function escapeHtml(text) {
      if (typeof text !== 'string') text = String(text || '');
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
